services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth-service:
    build:
      context: .
      args:
        SERVICE: auth-service
    env_file: .env

  task-service:
    build:
      context: .
      args:
        SERVICE: task-service
    env_file: .env

  media-service:
    build:
      context: .
      args:
        SERVICE: media-service
    env_file: .env

  workflow-service:
    build:
      context: .
      args:
        SERVICE: workflow-service
    env_file: .env

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    env_file: .env
    ports:
      - "3000:3000"